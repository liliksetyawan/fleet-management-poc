services:
  backend:
    build: .
    container_name: fleet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:root@postgres:5432/fleet?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_CLIENT_ID: fleet-backend
      GEOFENCE_LAT: ${GEOFENCE_LAT:--6.2088}
      GEOFENCE_LON: ${GEOFENCE_LON:-106.8456}
      GEOFENCE_RADIUS_METERS: ${GEOFENCE_RADIUS_METERS:-50}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started

  publisher-cli:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    container_name: fleet-mock-publisher
    restart: unless-stopped
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      VEHICLE_ID: B1234XYZ
      MOCK_LATITUDE: ${GEOFENCE_LAT:--6.2088}
      MOCK_LONGITUDE: ${GEOFENCE_LON:-106.8456}
    depends_on:
      mosquitto:
        condition: service_started
    profiles:
      - publisher
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fleet-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fleet-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  postgres_data:
